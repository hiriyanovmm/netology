- name: Install LightHouse
  hosts: lighthouse

  handlers:
    - name: Restart nginx
      become: true
      ansible.builtin.service:
        name: nginx
        state: restarted

  tasks:
    - name: Add NGINX repository
      become: true
      ansible.builtin.yum_repository:
        name: nginx-stable
        description: nginx stable repo
        baseurl: https://nginx.org/packages/rhel/$releasever/$basearch/
        gpgcheck: true
        gpgkey: https://nginx.org/keys/nginx_signing.key
        enabled: true
        module_hotfixes: true

    - name: Install Nginx
      become: true
      ansible.builtin.yum:
        name: nginx
        state: present

    - name: Create LightHouse directory
      become: true
      ansible.builtin.file:
        path: /usr/share/nginx/html/lighthouse
        state: directory
        mode: '0755'

    - name: Download LightHouse archive
      become: true
      ansible.builtin.get_url:
        url: https://github.com/VKCOM/lighthouse/archive/refs/heads/master.zip
        dest: /tmp/lighthouse.zip
        mode: '0644'

    - name: Install unzip
      become: true
      ansible.builtin.yum:
        name: unzip
        state: present

    - name: Unpack LightHouse
      become: true
      ansible.builtin.unarchive:
        src: /tmp/lighthouse.zip
        dest: /tmp/
        remote_src: true

    - name: Copy LightHouse static files
      become: true
      ansible.builtin.copy:
        src: /tmp/lighthouse-master/
        dest: /usr/share/nginx/html/lighthouse/
        remote_src: true
        mode: preserve

    - name: Configure Nginx for LightHouse
      become: true
      ansible.builtin.template:
        src: lighthouse.conf.j2
        dest: /etc/nginx/conf.d/lighthouse.conf
        mode: '0644'
      notify: Restart nginx

    - name: Start and enable nginx
      become: true
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
