---
- name: Install APT repository prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'
  tags:
    - vector
    - vector:repository
    - vector:install

- name: Install RPM repository prerequisites
  become: true
  ansible.builtin.package:
    name:
      - curl
      - ca-certificates
    state: present
  when: ansible_os_family == 'RedHat'
  tags:
    - vector
    - vector:repository
    - vector:install

- name: Check installed packages
  ansible.builtin.package_facts:
    manager: auto
  tags:
    - vector
    - vector:repository
    - vector:install

- name: Add Vector repository
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://setup.vector.dev | bash
  args:
    executable: /bin/bash
  when:
    - ansible_os_family in ['Debian', 'RedHat']
    - "'vector' not in ansible_facts.packages"
  tags:
    - vector
    - vector:repository
    - vector:install

- name: Install Vector package on Debian and Ubuntu
  become: true
  ansible.builtin.apt:
    name: vector
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'
  tags:
    - vector
    - vector:package
    - vector:install

- name: Install Vector package on RPM systems
  become: true
  ansible.builtin.yum:
    name: vector
    state: present
    update_cache: true
  when: ansible_os_family == 'RedHat'
  tags:
    - vector
    - vector:package
    - vector:install
    
- name: Create Vector config directory
  become: true
  tags:
    - vector
    - vector:directories
    - vector:install
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    mode: "0755"

- name: Deploy Vector config
  become: true
  tags:
    - vector
    - vector:config
    - vector:deploy
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_path }}"
    owner: vector
    group: vector
    mode: "0640"
    validate: "/usr/bin/vector validate --config-yaml %s"
  notify: Restart vector service

- name: Enable and start Vector service
  become: true
  tags:
    - vector
    - vector:service
    - vector:install
  ansible.builtin.service:
    name: vector
    state: started
    enabled: true
  when: vector_manage_service | bool