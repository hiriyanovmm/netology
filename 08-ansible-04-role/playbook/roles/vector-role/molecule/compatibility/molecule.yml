---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: vector_compatibility
    image: docker.io/library/ubuntu:20.04
    pre_build_image: true
    command: sleep infinity

provisioner:
  name: ansible

verifier:
  name: ansible

scenario:
  name: compatibility
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy