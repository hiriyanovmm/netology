---
- name: Add NGINX repository
  become: true
  tags:
    - lighthouse
  ansible.builtin.yum_repository:
    name: "{{ lighthouse_nginx_repo_name }}"
    description: "{{ lighthouse_nginx_repo_description }}"
    baseurl: "{{ lighthouse_nginx_repo_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ lighthouse_nginx_repo_gpgkey }}"
    enabled: true
    module_hotfixes: true

- name: Refresh package cache
  become: true
  tags:
    - lighthouse
  ansible.builtin.yum:
    update_cache: true

- name: Install required packages
  become: true
  tags:
    - lighthouse
  ansible.builtin.yum:
    name:
      - nginx
      - unzip
    state: present

- name: Create LightHouse install directory
  become: true
  tags:
    - lighthouse
  ansible.builtin.file:
    path: "{{ lighthouse_install_dir }}"
    state: directory
    mode: "0755"

- name: Create temporary unpack directory
  become: true
  tags:
    - lighthouse
  ansible.builtin.file:
    path: "{{ lighthouse_unpack_dir }}"
    state: directory
    mode: "0755"

- name: Download LightHouse archive
  become: true
  tags:
    - lighthouse
  ansible.builtin.get_url:
    url: "{{ lighthouse_archive_url }}"
    dest: "{{ lighthouse_archive_path }}"
    mode: "0644"

- name: Unpack LightHouse archive
  become: true
  tags:
    - lighthouse
  ansible.builtin.unarchive:
    src: "{{ lighthouse_archive_path }}"
    dest: "{{ lighthouse_unpack_dir }}"
    remote_src: true
    extra_opts:
      - -o

- name: Find unpacked LightHouse directory
  become: true
  tags:
    - lighthouse
  ansible.builtin.find:
    paths: "{{ lighthouse_unpack_dir }}"
    file_type: directory
    recurse: false
  register: lighthouse_found_dirs

- name: Deploy LightHouse static files
  become: true
  tags:
    - lighthouse
  ansible.builtin.copy:
    src: "{{ (lighthouse_found_dirs.files | map(attribute='path') | list | first) }}/"
    dest: "{{ lighthouse_install_dir }}/"
    remote_src: true
    mode: preserve

- name: Configure NGINX for LightHouse
  become: true
  tags:
    - lighthouse
  ansible.builtin.template:
    src: lighthouse.conf.j2
    dest: "{{ lighthouse_nginx_conf_path }}"
    mode: "0644"
  notify: Restart nginx

- name: Enable and start nginx
  become: true
  tags:
    - lighthouse
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true